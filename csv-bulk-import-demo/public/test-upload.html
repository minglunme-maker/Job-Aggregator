<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pure HTML Upload Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .upload-box {
            border: 3px dashed #4CAF50;
            padding: 40px;
            text-align: center;
            border-radius: 10px;
            background: #f9f9f9;
            margin: 30px 0;
        }
        input[type="file"] {
            padding: 15px;
            font-size: 18px;
            cursor: pointer;
            border: 2px solid #4CAF50;
            border-radius: 5px;
            background: white;
        }
        #result {
            margin-top: 30px;
            padding: 20px;
            background: #e3f2fd;
            border-radius: 8px;
            display: none;
        }
        .url-list {
            list-style: none;
            padding: 0;
        }
        .url-item {
            padding: 10px;
            background: white;
            margin: 5px 0;
            border-radius: 4px;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <h1>🧪 Pure HTML Upload Test</h1>
    <p><strong>This is 100% plain HTML - no React, no frameworks, no dependencies.</strong></p>

    <div class="upload-box">
        <h2>Select Your CSV File:</h2>
        <input type="file" id="fileInput" accept=".csv" />
    </div>

    <div id="result">
        <h3 id="message"></h3>
        <ul id="urlList" class="url-list"></ul>
    </div>

    <div style="background: #fff3cd; padding: 20px; border-radius: 8px; margin-top: 30px;">
        <h3>📝 Your CSV should look like:</h3>
        <pre style="background: white; padding: 15px; border-radius: 4px;">URL
https://www.linkedin.com/jobs/view/123456
https://www.jobstreet.com.sg/job/789012
https://www.mycareersfuture.gov.sg/job/details/abc123</pre>
    </div>

    <script>
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];

            if (!file) {
                alert('No file selected');
                return;
            }

            console.log('File selected:', file.name);

            const reader = new FileReader();

            reader.onload = function(event) {
                const text = event.target.result;
                console.log('File content:', text);

                const lines = text.split('\n').filter(line => line.trim() !== '');
                const urls = lines.slice(1); // Skip header

                // Display results
                document.getElementById('message').textContent = `✅ Found ${urls.length} URLs in ${file.name}`;

                const urlList = document.getElementById('urlList');
                urlList.innerHTML = '';

                urls.forEach((url, index) => {
                    const li = document.createElement('li');
                    li.className = 'url-item';
                    li.textContent = `${index + 1}. ${url.trim()}`;
                    urlList.appendChild(li);
                });

                document.getElementById('result').style.display = 'block';
            };

            reader.onerror = function() {
                alert('Error reading file');
            };

            reader.readAsText(file);
        });

        // Test if script is running
        console.log('✅ Pure HTML test page loaded successfully');
        console.log('Click the file input button to test upload');
    </script>
</body>
</html>
